name: Build Android APK

on:
  push:
    branches:
      - claude/advanced-3d-mobile-game-kuhwuk
    paths:
      - "game/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JS dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nebula-drift-3d-debug-apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit APK into the repo (so it can be pulled directly)
        working-directory: .
        run: |
          mkdir -p releases
          cp game/android/app/build/outputs/apk/debug/app-debug.apk releases/nebula-drift-3d-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/nebula-drift-3d-debug.apk
          if git diff --cached --quiet; then
            echo "APK değişmedi, commit atlanıyor."
          else
            git commit -m "chore: derlenmiş APK'yı güncelle [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
