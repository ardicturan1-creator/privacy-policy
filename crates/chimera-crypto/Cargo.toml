[package]
name = "chimera-crypto"
version = "0.1.0"
edition = "2021"
description = "CHIMERA — paylasilan post-kuantum kriptografi cekirdegi (ML-KEM, ML-DSA, XChaCha20-Poly1305, Argon2id, Shamir, BLAKE3 Merkle)"

[dependencies]
argon2 = "0.5.3"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hybrid-array = "0.4.14"
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
sharks = "0.5.0"
zeroize = "1.9.0"
