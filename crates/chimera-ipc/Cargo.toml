[package]
name = "chimera-ipc"
version = "0.1.0"
edition = "2021"
description = "CHIMERA — mTLS-esdegeri, karsilikli kimlik dogrulamali, post-kuantum sifreli yerel IPC katmani"

[dependencies]
chimera-crypto = { path = "../chimera-crypto" }
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
interprocess = "2.4.3"
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
zeroize = "1.9.0"
