; ==========================================================
; Mafia VIP Protection - Ayar Dosyasi
; Tus isimleri .NET 'Keys' enum'una gore yazilir (F7, NumPad5, D1, LControlKey ...)
; Listeler virgulle ayrilir. Ondalik ayirici nokta veya virgul olabilir.
; ==========================================================

[Keys]
; Tek tus: menu. Baska modlarla catisma yasanmasin diye tum islemler
; (koruma, konvoy, hava destegi, takviye, VIP transfer...) menu icinden yapilir.
MenuKey = F7                 ; Ana menu

[General]
EnableBlips = true
ShowNotifications = true
AutoStartOnLoad = false      ; Oyun acilir acilmaz korumalari spawn et
ThreatRadius = 65            ; Tehdit tarama yaricapi (metre)
EngagePolice = false         ; Aranma varken polisi de tehdit say
RemoveDeadBodies = true
DeadBodyCleanupDelay = 25000 ; ms
PlayerDeathBehavior = Guard  ; Guard | Scatter | Vanish
TeleportDistance = 130       ; Bu mesafeden geride kalan koruma isinlanir
RelationshipGroupName = MAFIA_VIP_GUARDS
CodeRedEnabled = true        ; Ani can kaybinda tum ekip gecici olarak agresiflesir
CodeRedHealthDropThreshold = 35  ; Bu kadar ani can dususu Kod Kirmizi tetikler
CodeRedDuration = 12000       ; ms, agresif mod ne kadar surer
StuckSpeedThreshold = 1.5     ; Bu hizin altinda arac/koruma 'sikisti' sayilmaya baslar
StuckTimeThreshold = 7000     ; ms, bu sure sikisik kalirsa isinlanarak kurtarilir

[CloseProtection]
GuardCount = 6
MaxGuards = 8
GuardModels = s_m_m_highsec_01, s_m_m_highsec_02, s_m_y_blackops_01, s_m_m_armoured_01, s_m_m_armoured_02
Weapons = CarbineRifle, SpecialCarbine, CombatMG, PumpShotgun
SidearmWeapon = Pistol
Health = 400
Armor = 100
Accuracy = 75                ; 1-100
ShootRate = 800              ; 10-1000
CombatAbility = 2            ; 0 zayif, 1 orta, 2 profesyonel
CombatRange = 2              ; 0 yakin, 1 orta, 2 uzak
CombatMovement = 2           ; 0 sabit, 1 defansif, 2 ilerleyen
SeeingRange = 90
HearingRange = 110
Invincible = false
SuffersCriticalHits = false  ; false = kafa vurusu aninda oldurmez
InfiniteAmmo = true
AutoRespawn = true           ; Olen koruma yerine yenisi gelsin
RespawnDelay = 15000         ; ms
FollowSpeed = 2              ; 1 yuru, 2 kos, 3 sprint
StoppingRange = 1.2
DefaultFormation = Diamond   ; Diamond | Box | Column | Wedge | Circle
DefaultBehavior = Defensive  ; Aggressive | Defensive | Passive
RandomOutfits = true
; OutfitSets: her set 'component:drawable:texture' parcalarindan olusur, parcalar | ile ayrilir.
; Ornek: OutfitSets = 3:1:0|4:1:0|8:1:0|11:1:0, 3:2:0|4:2:0|8:2:0|11:2:0
OutfitSets =
BlipColor = 2                ; 2 = yesil
BlipSprite = 1

[Convoy]
SpawnVipVehicle = true       ; false: oyuncunun bindigi arac VIP araci sayilir
WarpPlayerIntoVip = false    ; true: oyuncu VIP aracina otomatik binsin
VipVehicleModel = cognoscenti2
LeadVehicleModels = kuruma2, schafter6
SupportVehicleModels = baller6, insurgent3, kuruma2
LeadVehicleCount = 1         ; 0-3
SupportVehicleCount = 2      ; 0-4
GuardsPerVehicle = 3         ; Surucu haric 0-3
SpeedNormal = 22
SpeedAggressive = 38
SpeedStealth = 14
DrivingStyleNormal = 786603
DrivingStyleAggressive = 786469
DrivingStyleStealth = 786603
MinDistance = 12
NoRoadsDistance = 20         ; Bu mesafenin altinda arac yol agini yok sayip dogrudan takip eder
DeployOnStop = true          ; Konvoy durunca korumalar insin
DeployRadius = 6.5
ArmoredVehicles = true
WindowTint = 5
PrimaryColor = 0
SecondaryColor = 0
BlipColor = 3                ; 3 = mavi
BlipSprite = 225

[AirSupport]
AirVehicleModels = buzzard, savage, valkyrie, annihilator
DefaultAirVehicle = buzzard
PilotModel = s_m_y_blackops_01
GunnerCount = 2              ; NOT: mermili helikopterlerde (buzzard vb.) yolcular silahi ATESLEYEMEZ,
;  sadece pilot otomatik ates eder; yolcular yalnizca dusurulurse yerde savasan ek m?rettebattir.
MaxAirUnits = 3              ; Ayni anda cagrilabilecek hava birimi sayisi
Height = 45
Radius = 60
Speed = 40
AutoEngage = true
Invincible = false
CargobobModel = cargobob3
LandingTimeout = 45000       ; ms, bu sureden sonra manuel inis (yere kilitleme) devreye girer
BlipColor = 5                ; 5 = sari
BlipSprite = 43

[Backup]
VehicleModels = insurgent3, baller6, kuruma2
SquadSize = 4
SpawnDistance = 160
Cooldown = 45000

[VipTransfer]
; Hiz/surus stili [Convoy] bolumundeki ayarlari kullanir (SpeedNormal,
; SpeedAggressive, DrivingStyleNormal/Aggressive, MinDistance, NoRoadsDistance,
; StuckSpeedThreshold, StuckTimeThreshold - bkz. [General] ve [Convoy]).
VehicleModels = kuruma2      ; Zirhli VIP transfer araclari (hepsi ayni/karisik olabilir)
VehicleCount = 5             ; VIP araci dahil toplam arac sayisi
GuardsPerEscort = 1          ; Escort araci basina ek koruma
ArrivalDistance = 9          ; Varis kabul mesafesi (metre)
DoorDelay = 1100             ; ms, kapi acma/kapama arasi bekleme
BoardTimeout = 8000          ; ms, binis/inis gorevi icin bekleme (sonra zorla isinlanir)
StageTimeoutPickup = 90000   ; ms, alis noktasina varis zaman asimi
StageTimeoutTravel = 180000  ; ms, hedefe varis zaman asimi (ulasilamazsa mevcut yerde durur)
DepartDistance = 150         ; Bu mesafeden sonra konvoy silinir
